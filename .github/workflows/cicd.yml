# .github/workflows/cicd.yml
name: Enterprise Build CI (Dockur)

on:
  push:
    branches: [cicd-enterprise]
  pull_request:
    branches: [cicd-enterprise]

env:
  # Must match student_name in terraform.tfvars
  TF_VAR_student_name: "lsavage"

jobs:
  check:
    # GitHub-hosted runner: Docker is available, /dev/kvm is not, so only the
    # plan and policy stages run here. This is where the CI state is recorded
    # on GitHub.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate -no-color
